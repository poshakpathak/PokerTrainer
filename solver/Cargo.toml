[package]
name = "pt-solver"
version = "0.1.0"
edition = "2021"
description = "Batch postflop solver for PokerTrainer, built on b-inary/postflop-solver"
license = "AGPL-3.0-or-later"

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509fe5077d019825f833eed04b16d342dfda1", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokerTrainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>PokerTrainer</h1>
    <nav>
      <button data-view="trainer">Postflop trainer</button>
      <button data-view="preflop">Preflop</button>
      <button data-view="study">Study</button>
      <button data-view="reports">Reports</button>
      <button data-view="solver">Solver</button>
      <button data-view="ranges">Ranges</button>
    </nav>
  </header>
  <main>
    <div id="view-trainer" hidden></div>
    <div id="view-preflop" hidden></div>
    <div id="view-study" hidden></div>
    <div id="view-reports" hidden></div>
    <div id="view-solver" hidden></div>
    <div id="view-ranges" hidden></div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
